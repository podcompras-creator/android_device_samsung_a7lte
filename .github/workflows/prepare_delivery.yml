name: Preservar ROM a7lte ja compilada

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ci/delivery-trigger.json]

permissions:
  contents: read
  actions: read

jobs:
  preserve:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Conferir execucao de origem
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          c=json.loads(Path('ci/delivery-request.json').read_text())
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=60) as r:
                  return json.load(r)
          run=get('/actions/runs/'+str(c['run_id']))
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']==c['workflow_commit']
          artifact=get('/actions/artifacts/'+str(c['artifact_id']))
          assert artifact['name']==c['artifact_name'] and not artifact['expired']
          assert artifact['workflow_run']['id']==c['run_id']
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('run_id='+str(c['run_id'])+'\n')
              out.write('artifact_name='+c['artifact_name']+'\n')
          print('Verified successful native source run and exact artifact identity.')
          PY

      - name: Baixar apenas artefato existente da execucao verificada
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          run-id: ${{ steps.request.outputs.run_id }}
          github-token: ${{ github.token }}
          path: downloaded

      - name: Conferir hashes e separar sem alterar imagens
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          c=json.loads(Path('ci/delivery-request.json').read_text())
          root=Path('downloaded'); out=Path('delivery'); out.mkdir()
          def sha(p):
              h=hashlib.sha256()
              with p.open('rb') as r:
                  for block in iter(lambda:r.read(1024*1024),b''):h.update(block)
              return h.hexdigest()
          for name,size,h in ((c['rom_name'],c['rom_bytes'],c['rom_sha256']),
                              ('boot.img',c['boot_bytes'],c['boot_sha256'])):
              matches=list(root.rglob(name))
              assert len(matches)==1 and matches[0].is_file() and not matches[0].is_symlink()
              p=matches[0]; assert p.stat().st_size==size and sha(p)==h
              shutil.copyfile(p,out/name); assert sha(out/name)==h
          rows=[c['rom_sha256']+'  '+c['rom_name'],c['boot_sha256']+'  boot.img']
          (out/'SHA256SUMS').write_text('\n'.join(rows)+'\n')
          (out/'ROM-SHA256SUMS').write_text(rows[0]+'\n')
          (out/'BOOT-SHA256SUMS').write_text(rows[1]+'\n')
          report=dict(c,result='PASS',operation='Byte-identical copy of existing native build outputs; no compilation, image edits or signing',device_tested=False,flash_ready=False)
          (out/'provenance.json').write_text(json.dumps(report,indent=2)+'\n')
          (out/'README.txt').write_text('Real native LineageOS16 a7lte build outputs from run42720944356, copied unchanged and hash-verified. Static packaging passed in that run. No device boot/HAL test; not certified for flashing. Known runtime GPS/RIL ABI issues remain documented in the project STATUS.md.\n')
          print(json.dumps(report,indent=2))
          PY

      - name: ROM unica e checksums
        uses: actions/upload-artifact@v4
        with:
          name: a7lte-rom-run8
          path: |
            delivery/lineage-*.zip
            delivery/ROM-SHA256SUMS
            delivery/provenance.json
            delivery/README.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Boot original e checksums
        uses: actions/upload-artifact@v4
        with:
          name: a7lte-boot-run8
          path: |
            delivery/boot.img
            delivery/BOOT-SHA256SUMS
            delivery/provenance.json
            delivery/README.txt
          compression-level: 1
          if-no-files-found: error
          retention-days: 14
