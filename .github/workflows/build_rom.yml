name: LineageOS 16 a7lte

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ci/build-trigger.json]

permissions:
  contents: read

concurrency:
  group: a7lte-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ANDROID_TREE: ${{ github.workspace }}/lineage
      PORT_ROOT: ${{ github.workspace }}/port
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 8G
      ALLOW_MISSING_DEPENDENCIES: 'true'
      # BoardConfigLineage.mk exports kernel flags to Soong only for a Lineage build.
      # Keep this set in the parent shell too, including the bootimage fallback.
      LINEAGE_BUILD: a7lte

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          path: port
          fetch-depth: 1

      - name: Liberar disco do runner descartavel
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          mkdir -p "$GITHUB_WORKSPACE/logs"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /iossd
          mapfile -t packages < <(dpkg-query -W -f='${binary:Package}\n' | \
            awk '/^(dotnet-|aspnetcore-|ghc|haskell-|azure-cli)/')
          if ((${#packages[@]})); then
            sudo apt-get purge -y "${packages[@]}"
          fi
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Instalar dependencias Android 9
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
            libncurses5-dev libtinfo5 libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip unzip zlib1g-dev python2 python3 openjdk-8-jdk \
            libelf-dev m4 ca-certificates openssl e2fsprogs android-sdk-libsparse-utils
          sudo apt-get clean
          ccache -M "$CCACHE_MAXSIZE"
          mkdir -p "$ANDROID_TREE" "$GITHUB_WORKSPACE/logs"
          git config --global user.name 'a7lte Actions builder'
          git config --global user.email 'a7lte-builder@users.noreply.github.com'

      - name: Restaurar cache de compilacao
        id: compile_cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: a7lte-pie-arm32-ccache-v1-${{ hashFiles('port/sources.lock.json', 'port/host-tools.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            a7lte-pie-arm32-ccache-v1-${{ hashFiles('port/sources.lock.json', 'port/host-tools.lock.json') }}-

      - name: Restaurar vendor CSB1 ja adquirido
        id: vendor_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_TREE }}/vendor/samsung/a7lte
          key: csb1-vendor-v1-${{ hashFiles('port/ci/prepare-csb1-vendor.py', 'port/scripts/extract-stock.py', 'port/scripts/generate-vendor.py', 'port/scripts/native-contracts.json', 'port/android/device/samsung/a7lte/proprietary-files.txt') }}

      - name: Preparar vendor CSB1 real para o build
        if: steps.vendor_cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_TREE/vendor/samsung/a7lte"
          if [[ -d "$PORT_ROOT/dispositivo/blobs" ]]; then
            rsync -a "$PORT_ROOT/dispositivo/blobs/" "$ANDROID_TREE/vendor/samsung/a7lte/"
          else
            save_evidence() {
              mkdir -p "$GITHUB_WORKSPACE/logs/stock-acquisition"
              for file in "$GITHUB_WORKSPACE/csb1-source/fetch-result.json" \
                "$GITHUB_WORKSPACE/csb1-source/system-file-catalog.json" \
                "$GITHUB_WORKSPACE/vendor-staging/generation-audit.json"; do
                if [[ -f "$file" ]]; then cp "$file" "$GITHUB_WORKSPACE/logs/stock-acquisition/"; fi
              done
            }
            trap save_evidence EXIT
            python3 "$PORT_ROOT/ci/fetch-csb1-system.py" --output "$GITHUB_WORKSPACE/csb1-source" \
              2>&1 | tee "$GITHUB_WORKSPACE/logs/stock-acquisition.log"
            python3 "$PORT_ROOT/ci/prepare-csb1-vendor.py" \
              --system "$GITHUB_WORKSPACE/csb1-source/system" --tree "$ANDROID_TREE" \
              --staging "$GITHUB_WORKSPACE/vendor-staging" --allow-missing-candidates \
              2>&1 | tee "$GITHUB_WORKSPACE/logs/vendor-generation.log"
            save_evidence
            # Only newly downloaded CI scratch is removed after vendor generation.
            rm -rf "$GITHUB_WORKSPACE/csb1-source/system" "$GITHUB_WORKSPACE/vendor-staging"
          fi
          df -h / | tee "$GITHUB_WORKSPACE/logs/disk-after-vendor.txt"

      - name: Conferir integridade do vendor para cache
        id: vendor_integrity
        shell: bash
        run: |
          if [[ -f "$ANDROID_TREE/vendor/samsung/a7lte/vendor-audit.json" ]]; then
            python3 "$PORT_ROOT/ci/verify-csb1-vendor-cache.py" --vendor "$ANDROID_TREE/vendor/samsung/a7lte"
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Preservar vendor adquirido mesmo se a compilacao posterior falhar
        if: steps.vendor_cache.outputs.cache-hit != 'true' && steps.vendor_integrity.outputs.eligible == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_TREE }}/vendor/samsung/a7lte
          key: ${{ steps.vendor_cache.outputs.cache-primary-key }}

      - name: Preservar vendor e auditoria para verificacao ABI
        if: steps.vendor_integrity.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a7lte-csb1-vendor-${{ github.run_number }}
          path: ${{ env.ANDROID_TREE }}/vendor/samsung/a7lte/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: repo init e manifesto local
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_TREE"
          python3 "$PORT_ROOT/tooling/repo" init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-16.0 --depth=1 --no-clone-bundle --repo-rev=v2.54
          python3 - <<'PYXML'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          tree = ET.parse(Path(os.environ['PORT_ROOT']) / 'local_manifests.xml')
          for project in tree.getroot().findall('project'):
              if project.get('name') == '__PORT_REPOSITORY__':
                  project.set('name', os.environ['GITHUB_REPOSITORY'])
                  project.set('revision', os.environ['GITHUB_SHA'])
          output = Path('.repo/local_manifests/a7lte.xml')
          output.parent.mkdir(parents=True, exist_ok=True)
          ET.indent(tree)
          tree.write(output, encoding='utf-8', xml_declaration=True)
          PYXML
          python3 "$PORT_ROOT/tooling/repo" manifest \
            -o "$GITHUB_WORKSPACE/logs/manifest-expanded.xml"

      - name: repo sync raso
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a7lte-askpass" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) echo x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/a7lte-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/a7lte-askpass"
          export GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$RUNNER_TEMP/a7lte-askpass"' EXIT
          cd "$ANDROID_TREE"
          bash "$PORT_ROOT/ci/sync-platform.sh"
          python3 "$PORT_ROOT/tooling/repo" manifest -r \
            -o "$GITHUB_WORKSPACE/logs/manifest-resolved.xml"

      - name: Materializar e conferir prebuilts antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PORT_ROOT/ci/verify-platform-prebuilts.py" \
            --tree "$ANDROID_TREE" --hydrate \
            --output "$GITHUB_WORKSPACE/logs/platform-prebuilts.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/platform-prebuilts.log"

      - name: Integrar arvore nativa e blobs locais
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PORT_ROOT/scripts/apply-overlay.py" --tree "$ANDROID_TREE"
          # Repo also checks out this staging package inside the Android tree.
          # The Pie source finder must ignore its duplicate source snapshots.
          test -f "$ANDROID_TREE/.a7lte-port/.find-ignore"
          # Pie ships the 2 GiB phone heap profile under xhdpi, not xxhdpi.
          # Normalize the fetched common tree after sync and the native overlay.
          heap_profile=frameworks/native/build/phone-xhdpi-2048-dalvik-heap.mk
          test -f "$ANDROID_TREE/$heap_profile"
          sed -i 's|phone-xxhdpi-2048-dalvik-heap\.mk|phone-xhdpi-2048-dalvik-heap.mk|g' \
            "$ANDROID_TREE/device/samsung/qcom-common/qcom-common.mk" \
            "$ANDROID_TREE/device/samsung/a7lte/device.mk"
          if grep -nH -F 'phone-xxhdpi-2048-dalvik-heap.mk' \
            "$ANDROID_TREE/device/samsung/qcom-common/qcom-common.mk" \
            "$ANDROID_TREE/device/samsung/a7lte/device.mk"; then
            echo '::error::Obsolete Dalvik heap profile remains after integration.'
            exit 1
          fi
          printf 'Verified heap profile: %s\n' "$heap_profile" | \
            tee "$GITHUB_WORKSPACE/logs/dalvik-heap-integration.log"
          echo 'Vendor usa apenas o pacote fornecido ou bytes extraidos do CSB1 oficial.'
          ls -l "$ANDROID_TREE/vendor/samsung/a7lte/a7lte-vendor.mk"
          # Os patches de isolamento diagnostico nao sao aplicados.
          df -h / | tee "$GITHUB_WORKSPACE/logs/disk-before-build.txt"

      - name: Compilar ROM e tentar bootimage em caso de erro
        shell: bash
        run: |
          set -o pipefail
          cd "$ANDROID_TREE"
          # Android 9 invokes Python 2 scripts via /usr/bin/env python.
          # Keep the override scoped to this step; acquisition uses python3.
          mkdir -p "$RUNNER_TEMP/a7lte-python2-bin"
          ln -s "$(command -v python2)" "$RUNNER_TEMP/a7lte-python2-bin/python"
          export PATH="$RUNNER_TEMP/a7lte-python2-bin:$PATH"
          python --version 2>&1 | tee "$GITHUB_WORKSPACE/logs/build-python.txt"
          export ALLOW_MISSING_DEPENDENCIES=true
          # The selected Pie exporter reduced -j$$(nproc) to bare -j in run 5.
          # Use the supported numeric override so kernel make remains bounded.
          export TARGET_KERNEL_ADDITIONAL_FLAGS="${TARGET_KERNEL_ADDITIONAL_FLAGS:-} -j$(nproc)"
          printf 'TARGET_KERNEL_ADDITIONAL_FLAGS=%s\n' "$TARGET_KERNEL_ADDITIONAL_FLAGS" | \
            tee "$GITHUB_WORKSPACE/logs/build-concurrency.txt"
          watch_build_resources() {
            while true; do
              date -u +%FT%TZ
              df -h "$ANDROID_TREE"
              free -m
              sleep 15
            done
          }
          watch_build_resources > "$GITHUB_WORKSPACE/logs/build-resources.log" 2>&1 &
          a7lte_resource_pid=$!
          trap 'kill "$a7lte_resource_pid" 2>/dev/null || true' EXIT
          source build/envsetup.sh
          set +e
          # This is already a required native build target. Build it first so a
          # policy error is found before compiling the rest of Android again.
          lunch lineage_a7lte-userdebug > >(tee "$GITHUB_WORKSPACE/logs/lunch.log") 2>&1
          policy_rc=$?
          if ((policy_rc == 0)); then
            mka sepolicy_tests 2>&1 | tee "$GITHUB_WORKSPACE/logs/sepolicy-tests.log"
            policy_rc=${PIPESTATUS[0]}
          fi
          echo "required_policy_exit_code=$policy_rc" | tee "$GITHUB_WORKSPACE/logs/build-result.txt"
          if ((policy_rc == 0)); then
            brunch a7lte 2>&1 | tee "$GITHUB_WORKSPACE/logs/brunch.log"
            build_rc=${PIPESTATUS[0]}
            echo "brunch_executed=true brunch_exit_code=$build_rc" | \
              tee -a "$GITHUB_WORKSPACE/logs/build-result.txt"
          else
            build_rc=$policy_rc
            echo 'brunch_executed=false; required native policy target failed first.' | \
              tee "$GITHUB_WORKSPACE/logs/brunch.log" | \
              tee -a "$GITHUB_WORKSPACE/logs/build-result.txt"
          fi
          if ((build_rc != 0)); then
            export TARGET_PRODUCT=lineage_a7lte
            export TARGET_BUILD_VARIANT=userdebug
            mka bootimage 2>&1 | tee "$GITHUB_WORKSPACE/logs/bootimage.log"
            boot_rc=${PIPESTATUS[0]}
            echo "bootimage_exit_code=$boot_rc" | \
              tee -a "$GITHUB_WORKSPACE/logs/build-result.txt"
          fi
          tail -n 50 "$GITHUB_WORKSPACE/logs/brunch.log" \
            > "$GITHUB_WORKSPACE/logs/brunch-last-50.log"
          if [[ -f "$GITHUB_WORKSPACE/logs/bootimage.log" ]]; then
            tail -n 50 "$GITHUB_WORKSPACE/logs/bootimage.log" \
              > "$GITHUB_WORKSPACE/logs/bootimage-last-50.log"
          fi
          exit "$build_rc"

      - name: Conferir progresso do cache de compilacao
        id: compile_cache_status
        if: always() && steps.compile_cache.outcome == 'success'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/logs" "$CCACHE_DIR"
          ccache -s | tee "$GITHUB_WORKSPACE/logs/ccache-stats.txt"
          cache_kib=$(du -sk "$CCACHE_DIR" | awk '{print $1}')
          if ((cache_kib >= 1024)); then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Preservar objetos em cache mesmo apos falha
        if: always() && steps.compile_cache_status.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compile_cache.outputs.cache-primary-key }}

      - name: Gerar checksums dos artefatos realmente produzidos
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['ANDROID_TREE']) / 'out/target/product/a7lte'
          rows = []
          for p in sorted(root.glob('*')):
              if p.is_file() and (p.suffix == '.zip' or p.name == 'boot.img'):
                  h = hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda: f.read(1024 * 1024), b''):
                          h.update(b)
                  rows.append(h.hexdigest() + '  ' + p.name)
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'logs'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'SHA256SUMS').write_text('\n'.join(rows) + '\n')
          variables = Path(os.environ['ANDROID_TREE']) / 'out/soong/soong.variables'
          if variables.is_file():
              import json
              config = json.loads(variables.read_text())
              kernel_vars = config.get('VendorVars', {}).get('lineageVarsPlugin', {})
              (output / 'soong-lineage-kernel-vars.json').write_text(
                  json.dumps(kernel_vars, indent=2, sort_keys=True) + '\n')
          PY

      - name: Validar empacotamento dos artefatos produzidos
        if: always()
        shell: bash
        run: |
          set -o pipefail
          python3 "$PORT_ROOT/ci/validate-built-artifacts.py" \
            --product-out "$ANDROID_TREE/out/target/product/a7lte" \
            --output "$GITHUB_WORKSPACE/logs/artifact-validation.json" \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/artifact-validation.log"

      - name: Upload ZIP ou boot.img e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7lte-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/lineage/out/target/product/a7lte/*.zip
            ${{ github.workspace }}/lineage/out/target/product/a7lte/boot.img
            ${{ github.workspace }}/logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1

      - name: Upload independente dos logs para acompanhamento automatico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7lte-logs-${{ github.run_number }}
          path: ${{ github.workspace }}/logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
