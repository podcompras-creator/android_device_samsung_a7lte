name: LineageOS 16 a7lte

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ci/build-trigger.json]

permissions:
  contents: read

concurrency:
  group: a7lte-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ANDROID_TREE: ${{ github.workspace }}/lineage
      PORT_ROOT: ${{ github.workspace }}/port
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 2G
      ALLOW_MISSING_DEPENDENCIES: 'true'

    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
        with:
          path: port
          fetch-depth: 1

      - name: Liberar disco do runner descartavel
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          mkdir -p "$GITHUB_WORKSPACE/logs"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /iossd
          mapfile -t packages < <(dpkg-query -W -f='${binary:Package}\n' | \
            awk '/^(dotnet-|aspnetcore-|ghc|haskell-|azure-cli)/')
          if ((${#packages[@]})); then
            sudo apt-get purge -y "${packages[@]}"
          fi
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Instalar dependencias Android 9
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 \
            libncurses5-dev libtinfo5 libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip unzip zlib1g-dev python2 python3 openjdk-8-jdk \
            libelf-dev m4 ca-certificates openssl e2fsprogs android-sdk-libsparse-utils
          sudo apt-get clean
          ccache -M "$CCACHE_MAXSIZE"
          mkdir -p "$ANDROID_TREE" "$GITHUB_WORKSPACE/logs"
          git config --global user.name 'a7lte Actions builder'
          git config --global user.email 'a7lte-builder@users.noreply.github.com'

      - name: Restaurar vendor CSB1 ja adquirido
        id: vendor_cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ANDROID_TREE }}/vendor/samsung/a7lte
          key: csb1-vendor-v1-${{ hashFiles('port/ci/prepare-csb1-vendor.py', 'port/scripts/extract-stock.py', 'port/scripts/generate-vendor.py', 'port/scripts/native-contracts.json') }}

      - name: Preparar vendor CSB1 real para o build
        if: steps.vendor_cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 120
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_TREE/vendor/samsung/a7lte"
          if [[ -d "$PORT_ROOT/dispositivo/blobs" ]]; then
            rsync -a "$PORT_ROOT/dispositivo/blobs/" "$ANDROID_TREE/vendor/samsung/a7lte/"
          else
            save_evidence() {
              mkdir -p "$GITHUB_WORKSPACE/logs/stock-acquisition"
              for file in "$GITHUB_WORKSPACE/csb1-source/fetch-result.json" \
                "$GITHUB_WORKSPACE/vendor-staging/generation-audit.json"; do
                if [[ -f "$file" ]]; then cp "$file" "$GITHUB_WORKSPACE/logs/stock-acquisition/"; fi
              done
            }
            trap save_evidence EXIT
            python3 "$PORT_ROOT/ci/fetch-csb1-system.py" --output "$GITHUB_WORKSPACE/csb1-source" \
              2>&1 | tee "$GITHUB_WORKSPACE/logs/stock-acquisition.log"
            python3 "$PORT_ROOT/ci/prepare-csb1-vendor.py" \
              --system "$GITHUB_WORKSPACE/csb1-source/system" --tree "$ANDROID_TREE" \
              --staging "$GITHUB_WORKSPACE/vendor-staging" --allow-missing-candidates \
              2>&1 | tee "$GITHUB_WORKSPACE/logs/vendor-generation.log"
            save_evidence
            # Only newly downloaded CI scratch is removed after vendor generation.
            rm -rf "$GITHUB_WORKSPACE/csb1-source/system" "$GITHUB_WORKSPACE/vendor-staging"
          fi
          df -h / | tee "$GITHUB_WORKSPACE/logs/disk-after-vendor.txt"

      - name: Conferir integridade do vendor para cache
        id: vendor_integrity
        shell: bash
        run: |
          if [[ -f "$ANDROID_TREE/vendor/samsung/a7lte/vendor-audit.json" ]]; then
            python3 "$PORT_ROOT/ci/verify-csb1-vendor-cache.py" --vendor "$ANDROID_TREE/vendor/samsung/a7lte"
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Preservar vendor adquirido mesmo se a compilacao posterior falhar
        if: steps.vendor_cache.outputs.cache-hit != 'true' && steps.vendor_integrity.outputs.eligible == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ANDROID_TREE }}/vendor/samsung/a7lte
          key: ${{ steps.vendor_cache.outputs.cache-primary-key }}

      - name: Preservar vendor e auditoria para verificacao ABI
        if: steps.vendor_integrity.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: a7lte-csb1-vendor-${{ github.run_number }}
          path: ${{ env.ANDROID_TREE }}/vendor/samsung/a7lte/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: repo init e manifesto local
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_TREE"
          python3 "$PORT_ROOT/tooling/repo" init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-16.0 --depth=1 --no-clone-bundle --repo-rev=v2.54
          python3 - <<'PYXML'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          tree = ET.parse(Path(os.environ['PORT_ROOT']) / 'local_manifests.xml')
          for project in tree.getroot().findall('project'):
              if project.get('name') == '__PORT_REPOSITORY__':
                  project.set('name', os.environ['GITHUB_REPOSITORY'])
                  project.set('revision', os.environ['GITHUB_SHA'])
          output = Path('.repo/local_manifests/a7lte.xml')
          output.parent.mkdir(parents=True, exist_ok=True)
          ET.indent(tree)
          tree.write(output, encoding='utf-8', xml_declaration=True)
          PYXML
          python3 "$PORT_ROOT/tooling/repo" manifest \
            -o "$GITHUB_WORKSPACE/logs/manifest-expanded.xml"

      - name: repo sync raso
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/a7lte-askpass" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) echo x-access-token ;;
            *) printf '%s\n' "$GH_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/a7lte-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/a7lte-askpass"
          export GIT_TERMINAL_PROMPT=0
          trap 'rm -f "$RUNNER_TEMP/a7lte-askpass"' EXIT
          cd "$ANDROID_TREE"
          bash "$PORT_ROOT/ci/sync-platform.sh"
          python3 "$PORT_ROOT/tooling/repo" manifest -r \
            -o "$GITHUB_WORKSPACE/logs/manifest-resolved.xml"

      - name: Integrar arvore nativa e blobs locais
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PORT_ROOT/scripts/apply-overlay.py" --tree "$ANDROID_TREE"
          echo 'Vendor usa apenas o pacote fornecido ou bytes extraidos do CSB1 oficial.'
          ls -l "$ANDROID_TREE/vendor/samsung/a7lte/a7lte-vendor.mk"
          # Os patches de isolamento diagnostico nao sao aplicados.
          df -h / | tee "$GITHUB_WORKSPACE/logs/disk-before-build.txt"

      - name: Compilar ROM e tentar bootimage em caso de erro
        shell: bash
        run: |
          set -o pipefail
          cd "$ANDROID_TREE"
          # Android 9 invokes Python 2 scripts via /usr/bin/env python.
          # Keep the override scoped to this step; acquisition uses python3.
          mkdir -p "$RUNNER_TEMP/a7lte-python2-bin"
          ln -s "$(command -v python2)" "$RUNNER_TEMP/a7lte-python2-bin/python"
          export PATH="$RUNNER_TEMP/a7lte-python2-bin:$PATH"
          python --version 2>&1 | tee "$GITHUB_WORKSPACE/logs/build-python.txt"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          set +e
          brunch a7lte 2>&1 | tee "$GITHUB_WORKSPACE/logs/brunch.log"
          build_rc=${PIPESTATUS[0]}
          echo "brunch_exit_code=$build_rc" | \
            tee "$GITHUB_WORKSPACE/logs/build-result.txt"
          if ((build_rc != 0)); then
            export TARGET_PRODUCT=lineage_a7lte
            export TARGET_BUILD_VARIANT=userdebug
            mka bootimage 2>&1 | tee "$GITHUB_WORKSPACE/logs/bootimage.log"
            boot_rc=${PIPESTATUS[0]}
            echo "bootimage_exit_code=$boot_rc" | \
              tee -a "$GITHUB_WORKSPACE/logs/build-result.txt"
          fi
          tail -n 50 "$GITHUB_WORKSPACE/logs/brunch.log" \
            > "$GITHUB_WORKSPACE/logs/brunch-last-50.log"
          exit "$build_rc"

      - name: Gerar checksums dos artefatos realmente produzidos
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['ANDROID_TREE']) / 'out/target/product/a7lte'
          rows = []
          for p in sorted(root.glob('*')):
              if p.is_file() and (p.suffix == '.zip' or p.name == 'boot.img'):
                  h = hashlib.sha256()
                  with p.open('rb') as f:
                      for b in iter(lambda: f.read(1024 * 1024), b''):
                          h.update(b)
                  rows.append(h.hexdigest() + '  ' + p.name)
          output = Path(os.environ['GITHUB_WORKSPACE']) / 'logs'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'SHA256SUMS').write_text('\n'.join(rows) + '\n')
          PY

      - name: Upload ZIP ou boot.img e logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a7lte-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/lineage/out/target/product/a7lte/*.zip
            ${{ github.workspace }}/lineage/out/target/product/a7lte/boot.img
            ${{ github.workspace }}/logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
